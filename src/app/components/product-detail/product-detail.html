
<div>
    <button (click)="goBack()" class="text-gray-500 mb-4">← Back</button>
    <div class="flex flex-col max-w-2xl mx-auto p-8">
        @if (product() == null) {
            <h1 class="text-3xl font-semibold">Product not found</h1>
        } @else if (!editing()) {
            <div class="flex justify-between">
                <h1 class="text-3xl font-semibold">{{product()!.name}}</h1>
                <button (click)="editProduct()" class="px-4 py-2 border border-gray-600 text-gray-600 rounded hover:bg-gray-50">Edit Product</button>
            </div>
            <p class="text-sm text-gray-400">ID: {{product()!.id}}</p>
            <div class="mt-4 space-y-1 text-gray-700">
                <p><span class="text-gray-400">Price</span> — €{{product()!.price}}</p>
                <p><span class="text-gray-400">In Stock</span> — {{product()!.stock}}</p>
                <p><span class="text-gray-400">Category</span> — {{product()!.categoryName}}</p>
            </div>
            <div class="mt-8 space-y-3">
                <div class="flex items-center gap-3">
                    <input #qtyIncrease value="1" type="number" min="1" class="border rounded px-3 py-1 w-24" placeholder="Qty" />
                    <button (click)="increaseStock(qtyIncrease.value)"  class="px-4 py-1 bg-green-600 text-white rounded">Increase stock</button>
                </div>
                <div class="flex items-center gap-3">
                    <input #qtyDecrease value="1" type="number" min="1" class="border rounded px-3 py-1 w-24" placeholder="Qty" />
                    <button (click)="this.decreaseStock(qtyDecrease.value)" class="px-4 py-1 bg-yellow-600 text-white rounded">Reduce Stock</button>
                </div>
            </div>
            <div class="mt-10 pt-6 border-t">
                <button (click)="deleteProduct()" class="px-4 py-2 border border-red-600 text-red-600 rounded hover:bg-red-50">
                    Delete Product
                </button>
            </div>
        } @else {
            <h1 class="text-2xl font-semibold mb-4">Edit Product</h1>
                <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
                    <input formControlName="name" placeholder="Name" class="border rounded px-3 py-2" />
                    <input formControlName="price" type="number" min="0" placeholder="Price" class="border rounded px-3 py-2" />
                    <select formControlName="categoryName" class="border rounded px-3 py-2">
                        <option value="" disabled>Select a category</option>
                        @for (category of categories(); track category.id) {
                            <option [value]="category.title">{{ category.title }}</option>
                        }
                    </select>
                    <div class="flex gap-3 mt-2">
                        <button type="submit" [disabled]="productForm.invalid" class="px-4 py-2 rounded bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed">Save Changes</button>
                        <button type="button" (click)="cancelEdit()" class="px-4 py-2 rounded border">Cancel</button>
                    </div>
                </form>
        }
    </div>
</div>
