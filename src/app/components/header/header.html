<header class="cursor-pointer sticky top-0 z-99 flex p-6 bg-white">
    <div class="w-1/5 flex justify-center items-center gap-8" routerLink="/">
        <img
            src="/images.png"
            alt="Zeiss Logo"
            class="h-10 w-auto"
        >
        <p>Zeiss Code Assessment</p>
    </div>
    <input
        placeholder="Enter the product's name to search"
        class="w-3/5 p-5 mr-10"
        (input)="onSearchInput($event.target.value)"
    >
    <button (click)="redirectToCreateProduct()" class="px-4 py-1 bg-yellow-600 text-white font-bold rounded-2xl">Create new product</button>
</header>
