<div>
    <button (click)="goBack()" class="text-gray-500 mb-4">← Back</button>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="flex flex-col max-w-2xl mx-auto p-8 border rounded-2xl gap-4">
        <h1 class="text-2xl font-semibold mb-2">Create Product</h1>
        <input formControlName="name" placeholder="Name" class="border rounded px-3 py-2"/>
        <input formControlName="price" type="number" min="0" placeholder="Price" class="border rounded px-3 py-2"/>
        <select formControlName="categoryName" class="border rounded px-3 py-2">
            <option value="" disabled selected >Select a category</option>
            @for (category of categories(); track category.id)
            {
                <option [value]="category.title">{{ category.title }}</option>
            }
        </select>
        <button
            type="submit"
            [disabled]="productForm.invalid"
            class="mt-2 px-4 py-2 rounded bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed"
        >Create Product</button>
    </form>
</div>
